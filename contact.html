<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact Us | AnvasTech</title>
  <link rel="icon" href="assets/favicon.png?v=1" type="image/png">
  <script>
    (function () {
      var root = document.documentElement;
      var apply = function () {
        var w = window.innerWidth || document.documentElement.clientWidth || 0;
        root.classList.toggle("is-narrow", w <= 991);
        root.classList.toggle("is-phone", w <= 760);
      };
      apply();
      window.addEventListener("resize", apply, { passive: true });
      window.addEventListener("orientationchange", apply, { passive: true });
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css?v=101">
  <link rel="stylesheet" href="css/responsive.css?v=4">
  <link rel="stylesheet" href="css/motion.css?v=36">
  <script>if(location.search.indexOf("motion=force")>-1||!window.matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("motion-ready");</script>
</head>
<body data-root=".">
  <div id="chrome-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="crumbs"><a href="index.html">Home</a> / Contact Us</p>
        <h1>Contact Us</h1>
        <p class="lede">Tell us what you need — a briefing, a proposal, or a conversation with our specialists.</p>
      </div>
    </section>
    <section class="section">
      <div class="wrap" style="max-width:820px">
        <form class="form-grid" id="contact-form">
          <div>
            <label for="first">First name</label>
            <input id="first" name="first" required>
          </div>
          <div>
            <label for="last">Last name</label>
            <input id="last" name="last" required>
          </div>
          <div>
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" required>
          </div>
          <div>
            <label for="company">Company</label>
            <input id="company" name="company" required>
          </div>
          <div class="full">
            <label for="interest">I'm interested in</label>
            <select id="interest" name="interest">
              <option>AI and Generative AI</option>
              <option>Cloud</option>
              <option>Engineering</option>
              <option>Careers</option>
              <option>Something else</option>
            </select>
          </div>
          <div class="full">
            <label for="msg">How can we help?</label>
            <textarea id="msg" name="msg" required></textarea>
          </div>
          <div class="full">
            <button class="btn-blue" type="submit">Submit</button>
            <p class="ask-note" id="contact-note"></p>
          </div>
        </form>
      </div>
    </section>
  </main>
  <div id="chrome-footer"></div>
  <script src="js/site.js?v=59"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/motion.js?v=39"></script>
  <script>
    document.getElementById("contact-form").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("contact-note").textContent = "Thanks. A specialist will follow up on this enquiry.";
      e.target.reset();
    });
  </script>
</body>
</html>
